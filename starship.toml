# Starship - p10k lean style
# 配色跟随终端主题：只用 ANSI 名称与文字属性，不写死 hex
# 字体要求：Nerd Font v3（Maple Mono NF 完全兼容）

format = "$os$directory$git_branch$git_status$character"
right_format = "$time"

add_newline = false

# 配色约定
#   （无颜色）  终端默认前景，配 bold 做强调
#   dimmed      终端默认前景调暗，用于次要文本
#   blue        路径、提示符
#   green       git 分支
#   purple      git 状态（ANSI magenta，Starship 里叫 purple）
#   red         错误、只读
#   yellow      时间
# 避免使用 black / white / bright-*：浅深主题切换时会失效，

# -- OS 图标 ------------------------------------------------------------------

[os]
format = "[$symbol]($style) "
style = "bold"
disabled = false

[os.symbols]
Macos   = "󰀵"
Ubuntu  = "󰕈"
Debian  = "󰣚"
Fedora  = "󰣛"
Arch    = "󰣇"
Windows = "󰍲"
Unknown = "󱚝"


# -- 目录 ---------------------------------------------------------------------

[directory]
format = "[󰉋 $path]($style)[$read_only]($read_only_style)"
style = "bold blue"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"


# -- Git 分支 -----------------------------------------------------------------

[git_branch]
format = "[ on ](dimmed)[$symbol$branch]($style)"
symbol = "ψ "
style = "bold green"
truncation_length = 30
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold purple"
conflicted  = "~"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
untracked   = "?"
stashed     = ""
modified    = "!"
staged      = "+"
renamed     = "»"
deleted     = "✘"


# -- 右侧：执行时间 -----------------------------------------------------------

[cmd_duration]
disabled = true

[time]
format = "[ at ](dimmed)[⊙ $time]($style) "
style = "yellow"
disabled = false
time_format = "%H:%M:%S"


# -- 填充 ---------------------------------------------------------------------

[fill]
disabled = true


# -- 提示符 -------------------------------------------------------------------

[character]
success_symbol = " [❯](blue bold)"
error_symbol   = " [❯](red bold)"
vimcmd_symbol  = " [❮](blue bold)"


# -- 关闭不需要的模块 ---------------------------------------------------------

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[cmake]
disabled = true

[c]
disabled = true

[java]
disabled = true

[lua]
disabled = true

